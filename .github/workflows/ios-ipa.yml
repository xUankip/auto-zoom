# Builds an unsigned .ipa on a macOS runner; sign & install it from Windows with Sideloadly.
name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags: ['ios-*']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr AutoZoom.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AutoZoom-ipa
          path: AutoZoom.ipa
